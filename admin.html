<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>관리자 | 강의 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{max-width:1200px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tab{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  .toggle{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0 10px}
  .toggle input{width:18px;height:18px;margin:0}
  .paybox{border:1px solid var(--line);border-radius:12px;padding:14px 14px 0;margin-bottom:14px}
  .lec-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .lec-row h3{margin:6px 0 2px;font-size:17px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .stat{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
  .stat b{color:var(--pri)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
  th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
  th{background:#f8f9fc;font-weight:700;white-space:nowrap;position:sticky;top:0}
  .tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
  td select{margin:0;padding:5px 6px;font-size:13px;width:auto}
  td .sm{font-size:12px;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar select{width:auto;margin:0}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .summary div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--muted)}
  .summary b{display:block;font-size:20px;color:var(--ink)}
  .login{max-width:380px;margin:60px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .sessrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .sessrow input{width:auto;margin:0}
  .modal{position:fixed;inset:0;background:rgba(20,24,35,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .card{max-width:560px;width:100%;margin:0}
  #lmInput{font-size:14px;background:#f8f9fc}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand" id="brand">강의 신청 관리자</span><button class="btn sm ghost hidden" id="logout">로그아웃</button></div></header>

<main class="wrap">
  <!-- 로그인 -->
  <div class="card login hidden" id="loginForm">
    <h2>관리자 로그인</h2>
    <p class="muted">등록된 관리자 구글 계정으로 로그인하세요.</p>
    <p class="err" id="loginErr"></p>
    <button class="btn" id="googleLogin">G&nbsp; 구글 계정으로 로그인</button>
  </div>

  <div id="adminApp" class="hidden">
    <div class="tabs">
      <button class="tab on" data-tab="list">강의 목록</button>
      <button class="tab" data-tab="edit" id="tabEdit">+ 새 강의 등록</button>
      <button class="tab" data-tab="apps">신청자 관리</button>
      <button class="tab" data-tab="company">업체 정보</button>
    </div>

    <!-- 강의 목록 -->
    <section id="pList"></section>

    <!-- 강의 등록/수정 -->
    <form id="pEdit" class="card hidden" novalidate>
      <h2 id="editTitle">새 강의 등록</h2>
      <input type="hidden" name="id">
      <label>강의명 <i>*</i><input name="title" required></label>
      <label>강의 소개<textarea name="description" rows="3" placeholder="신청 페이지 상단에 보이는 소개 문구"></textarea></label>
      <div class="lbl">일정 <i style="color:var(--red);font-style:normal">*</i> <span class="muted small">(날짜·시간을 선택하세요. 여러 회차면 ‘+ 일정 추가’)</span></div>
      <div id="sessList"></div>
      <button type="button" class="btn sm ghost" id="addSess" style="margin-bottom:14px">+ 일정 추가</button>
      <div class="grid3">
        <label>진행 방식 <i>*</i>
          <select name="format"><option value="offline">오프라인</option><option value="online">온라인</option><option value="hybrid">온·오프라인 병행</option></select>
        </label>
        <label>총 시간<input name="totalHours" placeholder="비우면 일정으로 자동 계산"></label>
        <label>수강료 (원, 무료는 0)<input name="fee" type="number" min="0" step="1000" value="0"></label>
      </div>
      <label>장소 / 접속 방법<textarea name="location" rows="2" placeholder="오프라인: 주소·강의실 / 온라인: 'ZOOM (접속 링크는 개별 안내)' 등"></textarea></label>
      <div class="grid2">
        <label>정원 (0 = 제한 없음)<input name="capacity" type="number" min="0" value="0"></label>
        <label>신청 마감일<input name="deadline" type="date"></label>
      </div>
      <label>수강 특전<textarea name="benefits" rows="3" placeholder="예) 수료증 발급, 자소서 1:1 첨삭 1회, 교재 무료 제공"></textarea></label>

      <h2 class="sec">할인 옵션</h2>
      <p class="muted small" style="margin-top:-4px">신청자가 결제 방법에서 ‘할인 신청’을 고르면 여기 등록한 할인 중 하나를 선택합니다. 할인이 없으면 ‘할인 신청’ 버튼은 보이지 않아요.</p>
      <div id="discList"></div>
      <button type="button" class="btn sm ghost" id="addDisc" style="margin-bottom:14px">+ 할인 추가</button>

      <h2 class="sec">결제 방법</h2>
      <div class="paybox">
        <label class="toggle"><input type="checkbox" name="bankOn"> 🏦 계좌이체 받기</label>
        <p class="muted small" id="bankInfo" style="margin:0 0 14px"></p>
      </div>
      <div class="paybox">
        <label class="toggle"><input type="checkbox" name="cardOn"> 💳 카드결제 받기</label>
        <label>카드결제 링크 (URL)<input name="cardUrl" type="url" placeholder="https://..."></label>
      </div>

      <label>환불 규정 <span class="muted small">(비워두면 기본 환불 규정이 표시됩니다)</span><textarea name="refundPolicy" rows="5"></textarea></label>
      <label>상태
        <select name="status"><option value="open">모집중 (신청 받기)</option><option value="closed">마감 (신청 막기)</option></select>
      </label>
      <p class="err" id="editErr"></p>
      <div class="acts"><button class="btn sm" type="submit">저장</button><button class="btn sm ghost" type="button" id="cancelEdit">취소</button></div>
    </form>

    <!-- 업체 정보 -->
    <form id="pCompany" class="card hidden" novalidate>
      <h2>업체 정보</h2>
      <p class="muted small">여기 저장한 계좌가 ‘계좌이체 받기’를 켠 모든 강의에 표시됩니다. 계좌가 바뀌면 여기서만 고치면 전체 강의에 바로 반영돼요.</p>
      <div class="grid3">
        <label>은행 <i>*</i><input name="bank" placeholder="예) 기업은행"></label>
        <label>계좌번호 <i>*</i><input name="account"></label>
        <label>예금주 <i>*</i><input name="holder" placeholder="예) 그릿마인드랩"></label>
      </div>
      <label>입금 안내 문구<input name="note" placeholder="예) 신청 후 3일 이내 입금 부탁드립니다."></label>
      <label>신청 페이지 하단 문의처<input name="contact" placeholder="예) 문의: 010-0000-0000 / info@gritmindlab.com"></label>
      <p class="err" id="companyErr"></p>
      <div class="acts"><button class="btn sm" type="submit">저장</button></div>
    </form>

    <!-- 신청자 관리 -->
    <section id="pApps" class="hidden">
      <div class="toolbar">
        <select id="appLec"></select>
        <select id="appFilter">
          <option value="">전체 상태</option><option value="pending">결제대기</option><option value="paid">결제완료</option><option value="cancel">취소/환불</option>
        </select>
        <select id="appReceipt">
          <option value="">증빙 전체</option><option value="need">증빙 미발급</option><option value="done">증빙 발급완료</option>
        </select>
        <button class="btn sm ghost" id="csv">엑셀(CSV) 다운로드</button>
      </div>
      <div class="summary" id="summary"></div>
      <div class="tblwrap"><table id="appTable"></table></div>
    </section>
  </div>
</main>
<div class="modal hidden" id="linkModal"><div class="card">
  <h2 id="lmTitle">신청 링크</h2>
  <input id="lmInput" readonly>
  <p class="small" id="lmMsg" style="margin:8px 0 14px"></p>
  <div class="acts"><button class="btn sm" id="lmCopy" type="button">링크 복사</button><a class="btn sm ghost" id="lmOpen" target="_blank" rel="noopener">열어보기</a><button class="btn sm ghost" id="lmClose" type="button">닫기</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp, increment }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, ADMIN_EMAILS, SITE, DEFAULT_CARD_URL, DEFAULT_REFUND, discPrice, discountsOf } from "./firebase-config.js";

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb), db = getFirestore(fb);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => Number(n || 0).toLocaleString("ko-KR") + "원";
const FORMAT = { offline: "오프라인", online: "온라인", hybrid: "병행" };
const STATUS = { pending: "결제대기", paid: "결제완료", cancel: "취소/환불" };
const PAY = { bank: "계좌이체", card: "카드결제", free: "무료" };
const RTYPE = { none: "-", cash_personal: "현금영수증(소득공제)", cash_business: "현금영수증(지출증빙)", tax_invoice: "세금계산서" };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); };
const base = location.href.replace(/admin\.html.*$/, "").replace(/[?#].*$/, "");
const linkOf = id => `${base}index.html?id=${id}`;

$("#brand").textContent = `${SITE.name} 강의 신청 관리자`;
let lectures = [], apps = [], unsubApps = null, company = {};

/* ---------- 로그인 ---------- */
onAuthStateChanged(auth, u => {
  if (u && !ADMIN_EMAILS.includes(u.email)) {
    $("#loginErr").textContent = `${u.email} 은(는) 관리자 계정이 아닙니다.`;
    signOut(auth); return;
  }
  $("#loginForm").classList.toggle("hidden", !!u);
  $("#adminApp").classList.toggle("hidden", !u);
  $("#logout").classList.toggle("hidden", !u);
  if (u) loadLectures();
});
$("#googleLogin").onclick = async () => {
  $("#loginErr").textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") $("#loginErr").textContent = "로그인 실패: " + e.code; }
};
$("#logout").onclick = () => signOut(auth);

/* ---------- 탭 ---------- */
function showTab(t) {
  $$(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#pList").classList.toggle("hidden", t !== "list");
  $("#pEdit").classList.toggle("hidden", t !== "edit");
  $("#pApps").classList.toggle("hidden", t !== "apps");
  $("#pCompany").classList.toggle("hidden", t !== "company");
  if (t === "apps") loadApps();
  if (t === "company") fillCompany();
}
$$(".tab").forEach(b => b.onclick = () => { if (b.dataset.tab === "edit") openEdit(); else showTab(b.dataset.tab); });

/* ---------- 강의 목록 ---------- */
function loadLectures() {
  onSnapshot(doc(db, "settings", "company"), s => { company = s.data() || {}; bankInfo(); });
  onSnapshot(collection(db, "lectures"), snap => {
    lectures = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderList(); fillLecSelect();
  });
}
function renderList() {
  if (!lectures.length) { $("#pList").innerHTML = `<div class="card empty">등록된 강의가 없습니다. ‘+ 새 강의 등록’을 눌러 시작하세요.</div>`; return; }
  $("#pList").innerHTML = lectures.map(l => `
    <div class="card">
      <div class="lec-row">
        <div>
          <div class="badges">
            ${l.status === "open" ? `<span class="badge green">모집중</span>` : `<span class="badge red">마감</span>`}
            <span class="badge">${FORMAT[l.format] || ""}</span>
            ${l.payBank?.enabled ? `<span class="badge gray">계좌</span>` : ""}${l.payCard?.enabled ? `<span class="badge gray">카드</span>` : ""}
          </div>
          <h3>${esc(l.title)}</h3>
          <div class="muted small">${esc(l.schedule).replace(/\n/g, " / ")}</div>
          <div class="stat"><span>수강료 <b>${Number(l.fee) ? won(l.fee) : "무료"}</b></span>
            ${discountsOf(l).map(d => `<span class="badge amber">${esc(d.label || "할인")} ${d.P.text}${d.until ? ` ~${d.until.slice(5)}` : ""}</span>`).join("")}<span>신청 <b>${l.applicantCount || 0}</b>${l.capacity > 0 ? ` / ${l.capacity}명` : "명"}</span>${l.deadline ? `<span>마감 ${esc(l.deadline)}</span>` : ""}</div>
        </div>
        <div class="acts">
          <button class="btn sm" data-a="copy" data-id="${l.id}">🔗 신청 링크 복사</button>
          <a class="btn sm ghost" href="${linkOf(l.id)}" target="_blank">미리보기</a>
          <button class="btn sm ghost" data-a="apps" data-id="${l.id}">신청자</button>
          <button class="btn sm ghost" data-a="edit" data-id="${l.id}">수정</button>
          <button class="btn sm ghost" data-a="dup" data-id="${l.id}">복제</button>
          <button class="btn sm ghost" data-a="toggle" data-id="${l.id}">${l.status === "open" ? "마감하기" : "다시 열기"}</button>
          <button class="btn sm danger" data-a="del" data-id="${l.id}">삭제</button>
        </div>
      </div>
    </div>`).join("");
}
$("#pList").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const l = lectures.find(x => x.id === b.dataset.id);
  switch (b.dataset.a) {
    case "copy": showLink(linkOf(l.id), l.title); break;
    case "apps": $("#appLec").value = l.id; showTab("apps"); break;
    case "edit": openEdit(l); break;
    case "dup": { const { id, createdAt, applicantCount, ...rest } = l; openEdit({ ...rest, title: rest.title + " (복사본)" }, true); break; }
    case "toggle": await updateDoc(doc(db, "lectures", l.id), { status: l.status === "open" ? "closed" : "open" }); break;
    case "del":
      if ((l.applicantCount || 0) > 0 && !confirm(`신청자가 ${l.applicantCount}명 있습니다. 강의만 삭제되고 신청자 기록은 남습니다. 삭제할까요?`)) return;
      if (!(l.applicantCount > 0) && !confirm("이 강의를 삭제할까요?")) return;
      await deleteDoc(doc(db, "lectures", l.id)); toast("삭제했어요"); break;
  }
});

/* ---------- 링크 복사 (자동 복사가 막혀도 링크를 보여줌) ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  try {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch { return false; }
}
async function showLink(url, title) {
  $("#lmTitle").textContent = `${title} — 신청 링크`;
  $("#lmInput").value = url; $("#lmOpen").href = url;
  $("#linkModal").classList.remove("hidden");
  const ok = await copyText(url);
  $("#lmInput").select();
  $("#lmMsg").innerHTML = ok
    ? `<span style="color:var(--green);font-weight:700">✓ 링크가 복사되었습니다.</span> 카톡·문자에 붙여넣기 하세요.`
    : `<span style="color:var(--amber);font-weight:700">자동 복사가 막혀 있어요.</span> 위 링크가 선택되어 있으니 <b>Ctrl+C</b>(맥은 ⌘+C)를 눌러 복사하세요.`;
}
$("#lmCopy").onclick = async () => { await showLink($("#lmInput").value, $("#lmTitle").textContent.replace(/ — 신청 링크$/, "")); };
$("#lmInput").onclick = e => e.target.select();
$("#lmClose").onclick = () => $("#linkModal").classList.add("hidden");
$("#linkModal").onclick = e => { if (e.target.id === "linkModal") $("#linkModal").classList.add("hidden"); };

/* ---------- 강의 등록/수정 ---------- */
const F = $("#pEdit");
function openEdit(l = null, isCopy = false) {
  F.reset();
  F.id.value = isCopy || !l ? "" : l.id;
  $("#editTitle").textContent = l && !isCopy ? "강의 수정" : "새 강의 등록";
  if (l) {
    ["title","description","schedule","dateStart","format","totalHours","fee","location","capacity","deadline","benefits","refundPolicy","status"]
      .forEach(k => { if (F[k] && l[k] != null) F[k].value = l[k]; });
    F.bankOn.checked = !!l.payBank?.enabled;
    F.cardOn.checked = !!l.payCard?.enabled; F.cardUrl.value = l.payCard?.url || "";
    setDiscs(l.discounts || (l.discount?.type && l.discount.type !== "none" ? [l.discount] : []));
    setSess(l.sessions || []);
  } else {
    F.bankOn.checked = true; F.cardOn.checked = true; F.cardUrl.value = DEFAULT_CARD_URL; F.refundPolicy.value = DEFAULT_REFUND;
    setDiscs([]);
    setSess([]);
  }
  $("#editErr").textContent = "";
  if (F.cardOn.checked && !F.cardUrl.value) F.cardUrl.value = DEFAULT_CARD_URL;
  discPreview(); bankInfo();
  showTab("edit"); window.scrollTo(0, 0);
}
/* ---------- 일정 (달력·시간 선택) ---------- */
const WD = "일월화수목금토";
const toMin = t => { const [h, mi] = t.split(":").map(Number); return h * 60 + mi; };
function sessRow(s = {}) {
  const el = document.createElement("div");
  el.className = "sessrow";
  el.innerHTML = `<input type="date" data-k="date"><input type="time" data-k="start" step="600"><span>~</span><input type="date" data-k="endDate"><input type="time" data-k="end" step="600"><button type="button" class="mini" data-rm>삭제</button>`;
  el.querySelector("[data-k=date]").value = s.date || "";
  el.querySelector("[data-k=start]").value = s.start || "10:00";
  el.querySelector("[data-k=endDate]").value = s.endDate || s.date || "";
  el.querySelector("[data-k=end]").value = s.end || "12:00";
  // 시작 날짜를 고르면 종료 날짜가 비어있거나 더 빠를 때 같은 날로 맞춤
  el.querySelector("[data-k=date]").addEventListener("change", e => {
    const ed = el.querySelector("[data-k=endDate]");
    if (!ed.value || ed.value < e.target.value) ed.value = e.target.value;
  });
  return el;
}
function setSess(list) { $("#sessList").innerHTML = ""; (list.length ? list : [{}]).forEach(s => $("#sessList").appendChild(sessRow(s))); }
function getSess() {
  return [...document.querySelectorAll(".sessrow")]
    .map(r => { const g = k => r.querySelector(`[data-k=${k}]`).value; return { date: g("date"), start: g("start"), endDate: g("endDate") || g("date"), end: g("end") }; })
    .filter(s => s.date).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
}
const fmtDate = ds => { const [y, m, d] = ds.split("-").map(Number); return `${y}.${m}.${d}(${WD[new Date(y, m - 1, d).getDay()]})`; };
const stamp = (ds, t) => new Date(`${ds}T${t || "00:00"}`).getTime();
function fmtSess(s) {
  const ed = s.endDate || s.date;
  if (ed === s.date) return `${fmtDate(s.date)} ${s.start}${s.end ? "~" + s.end : ""}`.trim();
  return `${fmtDate(s.date)} ${s.start} ~ ${fmtDate(ed)} ${s.end}`.trim();
}
function sessMinutes(s) {
  if (!s.start || !s.end) return 0;
  const ed = s.endDate || s.date;
  // 하루 안의 일정: 시작~종료 시간 / 여러 날 일정: 매일 같은 시간대로 진행한다고 보고 (일수 × 하루 시간)
  const days = Math.round((stamp(ed) - stamp(s.date)) / 86400000) + 1;
  const perDay = toMin(s.end) - toMin(s.start);
  return perDay > 0 ? perDay * days : 0;
}
function autoHours(ss) {
  const m = ss.reduce((t, s) => t + sessMinutes(s), 0);
  return m > 0 ? `${+(m / 60).toFixed(1)}시간${ss.length > 1 ? ` (${ss.length}회)` : ""}` : "";
}
$("#addSess").onclick = () => { const last = getSess().slice(-1)[0]; $("#sessList").appendChild(sessRow(last ? { start: last.start, end: last.end } : {})); };
// 이전에 저장한 일정(종료 날짜 없음)도 그대로 불러옴
$("#sessList").addEventListener("click", e => { if (e.target.dataset.rm !== undefined && document.querySelectorAll(".sessrow").length > 1) e.target.closest(".sessrow").remove(); });

/* ---------- 할인 옵션 ---------- */
const DK = ["label", "type", "value", "until", "cardUrl", "note"];
function discRow(d = {}) {
  const el = document.createElement("div");
  el.className = "paybox discrow";
  el.innerHTML = `
    <div class="grid3">
      <label>할인 이름 <i>*</i><input data-k="label" placeholder="예) 얼리버드, 재학생, 무료초청"></label>
      <label>할인 방식<select data-k="type"><option value="percent">할인율 (0~100%)</option><option value="amount">정액 할인 (원)</option></select></label>
      <label>할인 값 <i>*</i><input data-k="value" type="number" min="0" placeholder="예) 20 또는 30000"></label>
    </div>
    <div class="grid3">
      <label>할인 마감일 (선택)<input data-k="until" type="date"></label>
      <label>할인가 카드결제 링크 (선택)<input data-k="cardUrl" type="url" placeholder="비우면 계좌이체로만 결제"></label>
      <label>신청자 안내 (선택)<input data-k="note" placeholder="예) 학생증 사본을 문자로 보내주세요"></label>
    </div>
    <div class="acts" style="justify-content:space-between;align-items:center;margin:-4px 0 12px"><span class="small disc-pv"></span><button type="button" class="mini" data-rm>삭제</button></div>`;
  DK.forEach(k => { if (d[k] != null) el.querySelector(`[data-k=${k}]`).value = d[k]; });
  if (!d.type || d.type === "none") el.querySelector("[data-k=type]").value = "percent";
  return el;
}
function setDiscs(list) { $("#discList").innerHTML = ""; list.forEach(d => $("#discList").appendChild(discRow(d))); }
function getDiscs() {
  return [...document.querySelectorAll(".discrow")].map(r => {
    const d = {}; DK.forEach(k => d[k] = r.querySelector(`[data-k=${k}]`).value.trim());
    d.value = Number(d.value || 0); return d;
  });
}
function discPreview() {
  document.querySelectorAll(".discrow").forEach(r => {
    const d = {}; DK.forEach(k => d[k] = r.querySelector(`[data-k=${k}]`).value.trim());
    const P = discPrice(F.fee.value, d, "0000-00-00");
    r.querySelector(".disc-pv").innerHTML = P
      ? `신청자 결제금액: <s class="muted">${won(F.fee.value)}</s> → <b style="color:var(--red)">${P.final ? won(P.final) : "무료"}</b> (${P.text})`
      : `<span class="muted">할인 값을 입력하면 할인가가 표시됩니다</span>`;
  });
}
$("#addDisc").onclick = () => { $("#discList").appendChild(discRow()); discPreview(); };
$("#discList").addEventListener("click", e => { if (e.target.dataset.rm !== undefined) { e.target.closest(".discrow").remove(); } });
["input", "change"].forEach(ev => $("#discList").addEventListener(ev, discPreview));
F.fee.addEventListener("input", discPreview);
function bankInfo() {
  $("#bankInfo").innerHTML = company.account
    ? `입금 계좌: <b>${esc(company.bank)} ${esc(company.account)}</b> (예금주 ${esc(company.holder)}) — ‘업체 정보’ 탭에서 변경`
    : `<span style="color:var(--red)">아직 입금 계좌가 없습니다. ‘업체 정보’ 탭에서 먼저 등록해주세요.</span>`;
}
const CF = $("#pCompany");
function fillCompany() { ["bank", "account", "holder", "note", "contact"].forEach(k => CF[k].value = company[k] || ""); $("#companyErr").textContent = ""; }
CF.addEventListener("submit", async e => {
  e.preventDefault();
  const d = {}; ["bank", "account", "holder", "note", "contact"].forEach(k => d[k] = CF[k].value.trim());
  if (!d.bank || !d.account || !d.holder) { $("#companyErr").textContent = "은행·계좌번호·예금주를 모두 입력해주세요."; return; }
  try { await setDoc(doc(db, "settings", "company"), { ...d, updatedAt: serverTimestamp() }); toast("업체 정보를 저장했어요"); }
  catch (ex) { console.error(ex); $("#companyErr").textContent = "저장 실패: 권한 또는 네트워크를 확인해주세요."; }
});
$("#cancelEdit").onclick = () => showTab("list");
F.addEventListener("submit", async e => {
  e.preventDefault();
  const v = k => F[k].value.trim();
  const err = m => $("#editErr").textContent = m;
  err("");
  const sessions = getSess();
  if (!v("title")) return err("강의명을 입력해주세요.");
  if (!sessions.length) return err("일정(날짜)을 하나 이상 선택해주세요.");
  if (sessions.some(s => stamp(s.endDate, s.end) <= stamp(s.date, s.start))) return err("종료 날짜·시간은 시작보다 늦어야 합니다.");
  const fee = Number(v("fee") || 0);
  if (fee > 0 && !F.bankOn.checked && !F.cardOn.checked) return err("유료 강의는 결제 방법을 하나 이상 선택해주세요.");
  if (F.bankOn.checked && !company.account) return err("‘업체 정보’ 탭에서 입금 계좌를 먼저 등록해주세요.");
  if (F.cardOn.checked && !/^https?:\/\//.test(v("cardUrl"))) return err("카드결제 링크를 https:// 로 시작하는 주소로 입력해주세요.");

  const discounts = getDiscs();
  for (const d of discounts) {
    if (!d.label) return err("할인 이름을 입력해주세요.");
    if (!(d.value > 0)) return err(`‘${d.label}’ 할인 값을 입력해주세요.`);
    if (d.type === "percent" && d.value > 100) return err(`‘${d.label}’ 할인율은 0~100% 사이로 입력해주세요.`);
    if (d.type === "amount" && d.value > fee) return err(`‘${d.label}’ 정액 할인은 수강료보다 클 수 없습니다.`);
    if (d.cardUrl && !/^https?:\/\//.test(d.cardUrl)) return err(`‘${d.label}’ 카드결제 링크를 https:// 로 시작하는 주소로 입력해주세요.`);
  }
  const data = {
    title: v("title"), description: v("description"), sessions, schedule: sessions.map(fmtSess).join("\n"), dateStart: sessions[0].date,
    format: F.format.value, totalHours: v("totalHours") || autoHours(sessions), fee, location: v("location"),
    capacity: Number(v("capacity") || 0), deadline: v("deadline"), benefits: v("benefits"),
    refundPolicy: v("refundPolicy"), status: F.status.value,
    payBank: { enabled: F.bankOn.checked },
    payCard: { enabled: F.cardOn.checked, url: v("cardUrl") },
    discounts, discount: null,
    updatedAt: serverTimestamp()
  };
  try {
    if (v("id")) await updateDoc(doc(db, "lectures", v("id")), data);
    else await addDoc(collection(db, "lectures"), { ...data, applicantCount: 0, createdAt: serverTimestamp() });
    toast("저장했어요"); showTab("list");
  } catch (ex) { console.error(ex); err("저장 실패: 권한 또는 네트워크를 확인해주세요."); }
});

/* ---------- 신청자 관리 ---------- */
function fillLecSelect() {
  const cur = $("#appLec").value;
  $("#appLec").innerHTML = `<option value="">전체 강의</option>` + lectures.map(l => `<option value="${l.id}">${esc(l.title)}</option>`).join("");
  $("#appLec").value = cur;
}
function loadApps() {
  if (unsubApps) unsubApps();
  const lid = $("#appLec").value;
  const q = lid ? query(collection(db, "applications"), where("lectureId", "==", lid)) : collection(db, "applications");
  unsubApps = onSnapshot(q, snap => {
    apps = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderApps();
  });
}
["#appLec"].forEach(s => $(s).onchange = loadApps);
["#appFilter", "#appReceipt"].forEach(s => $(s).onchange = renderApps);

function filtered() {
  const st = $("#appFilter").value, rc = $("#appReceipt").value;
  return apps.filter(a => (!st || a.status === st) &&
    (!rc || (a.receipt?.type !== "none" && (rc === "done" ? a.receiptIssued : !a.receiptIssued))));
}
const dt = ts => ts?.toDate ? ts.toDate().toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
function receiptText(r) {
  if (!r || r.type === "none") return "-";
  let s = `<b>${RTYPE[r.type]}</b><br>${esc(r.number)}`;
  if (r.bizName) s += `<br>${esc(r.bizName)}`;
  if (r.type === "tax_invoice") s += `<br><span class="sm">대표 ${esc(r.ceo)} · ${esc(r.invoiceEmail)}${r.bizType ? "<br>" + esc(r.bizType) : ""}</span>`;
  return s;
}
function renderApps() {
  const list = filtered();
  const paid = apps.filter(a => a.status === "paid");
  const needR = apps.filter(a => a.receipt?.type && a.receipt.type !== "none" && !a.receiptIssued && a.status !== "cancel");
  $("#summary").innerHTML = `
    <div>전체 신청<b>${apps.filter(a => a.status !== "cancel").length}명</b></div>
    <div>결제대기<b>${apps.filter(a => a.status === "pending").length}명</b></div>
    <div>결제완료<b>${paid.length}명</b></div>
    <div>결제완료 금액<b>${won(paid.reduce((s, a) => s + (a.fee || 0), 0))}</b></div>
    <div>증빙 발급 대기<b style="color:var(--amber)">${needR.length}건</b></div>`;
  if (!list.length) { $("#appTable").innerHTML = `<tr><td class="empty">신청자가 없습니다.</td></tr>`; return; }
  const showLec = !$("#appLec").value;
  $("#appTable").innerHTML = `
    <tr><th>#</th>${showLec ? "<th>강의</th>" : ""}<th>신청일</th><th>이름</th><th>연락처 / 이메일</th><th>소속</th><th>결제</th><th>입금자명</th><th>상태</th><th>증빙 요청</th><th>증빙 발급</th><th>메모</th><th></th></tr>` +
    list.map((a, i) => `
    <tr>
      <td>${list.length - i}</td>
      ${showLec ? `<td>${esc(a.lectureTitle)}</td>` : ""}
      <td class="sm">${dt(a.createdAt)}</td>
      <td><b>${esc(a.name)}</b></td>
      <td>${esc(a.phone)}<br><span class="sm">${esc(a.email)}</span></td>
      <td>${esc(a.org)}</td>
      <td>${PAY[a.payMethod] || ""}<br><span class="sm">${won(a.fee)}${a.discountLabel ? `<br>(${esc(a.discountLabel)})` : ""}</span></td>
      <td>${esc(a.depositor)}</td>
      <td><select data-st="${a.id}">${Object.entries(STATUS).map(([k, t]) => `<option value="${k}" ${a.status === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
      <td>${receiptText(a.receipt)}</td>
      <td>${a.receipt?.type && a.receipt.type !== "none" ? `<label class="chk"><input type="checkbox" data-rc="${a.id}" ${a.receiptIssued ? "checked" : ""}> 발급완료</label>` : "-"}</td>
      <td class="sm">${esc(a.memo)}</td>
      <td><button class="mini" data-del="${a.id}">삭제</button></td>
    </tr>`).join("");
}
$("#appTable").addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.st) {
    const a = apps.find(x => x.id === t.dataset.st), was = a.status, now = t.value;
    await updateDoc(doc(db, "applications", a.id), { status: now, statusAt: serverTimestamp() });
    // 취소 ↔ 복구 시 정원 카운트 조정
    if (was !== "cancel" && now === "cancel") await updateDoc(doc(db, "lectures", a.lectureId), { applicantCount: increment(-1) }).catch(() => {});
    if (was === "cancel" && now !== "cancel") await updateDoc(doc(db, "lectures", a.lectureId), { applicantCount: increment(1) }).catch(() => {});
    toast(`${a.name} → ${STATUS[now]}`);
  }
  if (t.dataset.rc) await updateDoc(doc(db, "applications", t.dataset.rc), { receiptIssued: t.checked });
});
$("#appTable").addEventListener("click", async e => {
  const id = e.target.dataset.del; if (!id) return;
  const a = apps.find(x => x.id === id);
  if (!confirm(`${a.name}님의 신청을 삭제할까요? (복구 불가)`)) return;
  await deleteDoc(doc(db, "applications", id));
  if (a.status !== "cancel") await updateDoc(doc(db, "lectures", a.lectureId), { applicantCount: increment(-1) }).catch(() => {});
  toast("삭제했어요");
});

/* ---------- CSV ---------- */
$("#csv").onclick = () => {
  const head = ["강의명","신청일시","이름","연락처","이메일","소속","결제방법","정가","결제금액","적용할인","입금자명","상태","증빙종류","발급번호(휴대폰/사업자번호)","상호","대표자","세금계산서 이메일","업태/종목","증빙발급","메모"];
  const rows = filtered().map(a => [
    a.lectureTitle, a.createdAt?.toDate?.().toLocaleString("ko-KR") || "", a.name, a.phone, a.email, a.org,
    PAY[a.payMethod] || "", a.originalFee ?? a.fee, a.fee, a.discountLabel || "", a.depositor, STATUS[a.status], RTYPE[a.receipt?.type] || "-",
    a.receipt?.number || "", a.receipt?.bizName || "", a.receipt?.ceo || "", a.receipt?.invoiceEmail || "", a.receipt?.bizType || "",
    a.receipt?.type && a.receipt.type !== "none" ? (a.receiptIssued ? "발급완료" : "미발급") : "", a.memo
  ]);
  const csv = [head, ...rows].map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const lec = lectures.find(l => l.id === $("#appLec").value);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = `신청자명단_${lec ? lec.title : "전체"}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};
</script>
